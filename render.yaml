databases:
  - name: localbizvault-db
    plan: free

services:
  - type: web
    name: localbizvault
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: localbizvault-db
          property: connectionString